<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>a tiny universe, for you</title>
<meta name="description" content="a tiny interactive universe" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- film grain / dust / vignette / light leak, sits above everything -->
  <canvas id="grain-canvas" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <div id="light-leak" aria-hidden="true"></div>

  <!-- webgl universe -->
  <canvas id="scene-canvas"></canvas>

  <!-- terminal intro -->
  <div id="terminal-screen">
    <div id="terminal-box">
      <div class="terminal-header" id="terminal-header"></div>
      <div class="terminal-body" id="terminal-body">
        <div class="terminal-line" id="terminal-prompt-label"></div>
        <div class="terminal-input-row">
          <span class="terminal-caret">&gt;</span>
          <input id="terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" />
        </div>
        <div id="terminal-output"></div>
      </div>
    </div>
    <div id="terminal-skip">tap anywhere to begin</div>
  </div>

  <!-- floating message card for interactive objects -->
  <div id="message-card" class="hidden">
    <div id="message-card-inner">
      <p id="message-card-text"></p>
      <button id="message-card-close" aria-label="close">✦</button>
    </div>
  </div>

  <!-- space dream cinematic text overlay -->
  <div id="dream-text" class="hidden"></div>

  <!-- letter scene -->
  <div id="letter-screen" class="hidden">
    <div id="letter-box">
      <div id="letter-heading"></div>
      <div id="letter-body"></div>
      <button id="letter-continue">continue</button>
    </div>
  </div>

  <!-- final scene -->
  <div id="final-screen" class="hidden">
    <div id="final-lines"></div>
    <button id="one-more-thing" class="hidden">one more thing...</button>
    <div id="secret-message" class="hidden"></div>
  </div>

  <!-- small persistent UI -->
  <div id="hud" class="hidden">
    <button id="music-toggle" aria-label="play music">
      <span class="note">♪</span>
    </button>
    <div id="hint-text"></div>
  </div>

  <audio id="bg-audio" loop preload="none"></audio>

  <div id="webgl-fallback" class="hidden">
    <p>Your device doesn't support the 3D universe, but the love still works.</p>
    <p id="fallback-letter"></p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
